<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Úkoly</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5e6d3, #e8d8c3);
  overflow: hidden;
}

/* ❤️ SRDÍČKA */
.bg {
  position: fixed; /* 🔥 změna z absolute */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.bg span {
  position: absolute;
  font-size: 30px;
  opacity: 0.25;
  animation: float 10s linear infinite;
}

@keyframes float {
  0% { transform: translateY(110vh); }
  100% { transform: translateY(-20vh); }
}

/* BOX */
.box {
  position: relative;
  z-index: 10; /* 🔥 musí být vysoko */
  background: rgba(255,255,255,0.9);
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  width: 90%;
  max-width: 340px;
}

/* INPUT */
input {
  margin-top: 10px;
  padding: 12px;
  width: 90%;
  border-radius: 10px;
  border: 1px solid #ccc;
  text-align: center;
  font-size: 16px; /* 🔥 důležité pro iOS (jinak zoom/bugy) */
}

/* BUTTON */
button {
  margin-top: 10px;
  padding: 12px;
  width: 90%;
  border: none;
  border-radius: 10px;
  background: #8c6a5d;
  color: white;
  font-size: 16px;
}

#msg {
  margin-top: 15px;
  font-weight: bold;
  display: none;
}
</style>
</head>

<body>

<div class="bg" id="hearts"></div>

<div class="box">
  <h2 id="title">Úkol č.2</h2>
  <span id="note">(malá písmena a s mezerou)</span><br>

  <input id="input" type="text" autocomplete="off">
  <button onclick="check()">Potvrdit</button>

  <div id="msg">Gratuluji 🎉</div>
</div>

<script>

/* ❤️ srdíčka */
const hearts = document.getElementById("hearts");
for (let i = 0; i < 30; i++) {
  let s = document.createElement("span");
  s.innerHTML = "❤️";
  s.style.left = Math.random()*100 + "%";
  s.style.animationDuration = (6 + Math.random()*10) + "s";
  hearts.appendChild(s);
}

let step = 2;

/* normalizace */
function normalizeText(text) {
  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

/* 🔥 Safari fix – kliknutí dá focus */
document.addEventListener("click", () => {
  document.getElementById("input").focus();
});

function showCongrats(nextStep, titleText, noteText) {
  const msg = document.getElementById("msg");
  msg.innerText = "Gratuluji 🎉";
  msg.style.display = "block";

  setTimeout(() => {
    msg.style.display = "none";
    document.getElementById("title").innerText = titleText;
    document.getElementById("input").value = "";
    document.getElementById("note").innerText = noteText || "";
    step = nextStep;
  }, 1200);
}

function check() {
  let val = normalizeText(document.getElementById("input").value);

  if (step === 2) {
    if (val === "cokoladovna janek") {
      showCongrats(3, "Úkol č.3", "(malá písmena a mezery)");
    } else alert("Špatně!");
  }

  else if (step === 3) {
    if (val === "adelitas lucemburska!") {
      showCongrats(4, "Úkol č.4", "");
    } else alert("Špatně!");
  }

  else if (step === 4) {
    if (val === "podivej se do darkove tasky") {
      showCongrats(5, "Úkol č.5", "(malá písmena)");
    } else alert("Špatně!");
  }

  else if (step === 5) {
    if (val === "automat matuska") {
      showCongrats(6, "Úkol č.6", "zadej slovo na 4 písmena - kam jedeme teď?");
    } else alert("Špatně!");
  }

  else if (step === 6) {
    if (val === "domu") {
      const msg = document.getElementById("msg");
      msg.innerText = "Jseš nejšikovnější luštitel! Čeká tě překvapení ve schránce! ❤️";
      msg.style.display = "block";

      document.getElementById("input").style.display = "none";
    } else alert("Špatně!");
  }
}
</script>

</body>
</html>
